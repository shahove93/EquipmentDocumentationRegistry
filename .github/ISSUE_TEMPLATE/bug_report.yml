name: Сообщить об ошибке
description: Опишите проблему без реальных документов и чувствительных данных.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Не добавляйте сюда документы, персональные или коммерческие данные, секреты и содержимое `.env`.
  - type: textarea
    id: summary
    attributes:
      label: Что произошло?
      description: Кратко опишите наблюдаемое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить?
      description: Укажите обезличенные шаги и примерные тестовые значения.
      placeholder: |
        1. Откройте …
        2. Выполните …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какого поведения ожидали?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Среда
      description: Например, WSL Ubuntu, версия приложения или браузер; без секретов.
    validations:
      required: false
